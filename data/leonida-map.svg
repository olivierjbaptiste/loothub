<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1600" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#091018"/>
      <stop offset="1" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2340"/>
      <stop offset="1" stop-color="#141233"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#2c2550" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- water + grid -->
  <rect width="1600" height="1600" fill="url(#water)"/>
  <rect width="1600" height="1600" fill="url(#grid)"/>

  <!-- main landmass -->
  <path d="M 500 150 C 700 120, 950 160, 1050 320 C 1150 480, 1120 650, 1180 780
           C 1240 910, 1230 1050, 1120 1180 C 1010 1310, 820 1330, 700 1250
           C 600 1180, 620 1020, 560 920 C 500 820, 380 800, 340 680
           C 300 560, 360 380, 420 280 C 460 210, 470 170, 500 150 Z"
        fill="url(#land)" stroke="#25e7ea" stroke-width="2.5" opacity="0.97" filter="url(#glow)"/>

  <!-- western inlet land (Port Gellhorn side) -->
  <path d="M 330 690 C 250 720, 210 820, 260 900 C 300 960, 380 940, 410 880
           C 440 820, 420 740, 360 700 Z" fill="url(#land)" stroke="#25e7ea" stroke-width="2" opacity="0.9"/>

  <!-- Leonida Keys (island chain) -->
  <g fill="#1a2340" stroke="#25e7ea" stroke-width="1.5" opacity="0.92">
    <ellipse cx="770" cy="1320" rx="34" ry="16"/>
    <ellipse cx="855" cy="1365" rx="30" ry="15"/>
    <ellipse cx="940" cy="1398" rx="27" ry="13"/>
    <ellipse cx="1025" cy="1420" rx="24" ry="12"/>
    <ellipse cx="1108" cy="1432" rx="20" ry="11"/>
  </g>

  <!-- Vice City street hint -->
  <g stroke="#ff2d95" stroke-width="1.4" opacity="0.30">
    <path d="M930 520 H1090 M930 560 H1090 M930 600 H1090 M930 640 H1080 M930 680 H1060"/>
    <path d="M950 500 V690 M990 500 V690 M1030 500 V690 M1070 510 V680"/>
  </g>

  <!-- region labels -->
  <g fill="#ece9f5" font-weight="700" text-anchor="middle">
    <text x="1010" y="470" font-size="30" fill="#ff6fb3" letter-spacing="2">VICE CITY</text>
    <text x="655" y="300" font-size="26" letter-spacing="2" opacity="0.85">MOUNT KALAGA</text>
    <text x="445" y="470" font-size="24" letter-spacing="2" opacity="0.85">PORT GELLHORN</text>
    <text x="705" y="770" font-size="26" letter-spacing="2" opacity="0.85">AMBROSIA</text>
    <text x="760" y="1080" font-size="26" fill="#7df0c0" letter-spacing="2" opacity="0.9">GRASSRIVERS</text>
    <text x="965" y="1470" font-size="24" fill="#74e3ea" letter-spacing="2" opacity="0.9">LEONIDA KEYS</text>
  </g>

  <!-- state label + placeholder note -->
  <text x="800" y="90" font-size="40" font-weight="800" fill="#b14aed" text-anchor="middle" letter-spacing="8" opacity="0.9">STATE OF LEONIDA</text>
  <text x="30" y="1575" font-size="20" fill="#9b95b8" opacity="0.7">PLACEHOLDER MAP — replace with the real GTA 6 map at launch</text>
</svg>
